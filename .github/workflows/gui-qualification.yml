name: Focused desktop GUI qualification
run-name: Desktop GUI qualification (${{ inputs.ref || '318c395be673013c2478180f537d34bb73202dc5' }})
on:
  push:
    branches: [validation/whitewh-gui-2026-10-28]
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-character source commit to qualify
        required: true
        type: string
      platform:
        description: Desktop platform to qualify
        type: choice
        options: [all, arch, macos, windows]
        default: all
      macos_runner:
        description: Standard GitHub-hosted macOS runner
        type: choice
        options: [macos-15, macos-26]
        default: macos-15
permissions:
  contents: read
cache-mode: read
jobs:
  arch:
    if: ${{ (inputs.platform || 'macos') == 'all' || (inputs.platform || 'macos') == 'arch' }}
    name: Arch desktop GUI
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    container:
      image: archlinux@sha256:996c3a1d6b0d87b01242f6fcd8cfa3ad3eece1a67ab5c8f108e20af1d7b97bdd
    env:
      CCACHE_DIR: /home/user/.cache/ccache
      CCACHE_MAXSIZE: 150M
      CMAKE_GENERATOR: Ninja
      ZERUS_BUILD_JOBS: 4
    steps:
      - name: Bootstrap Git before checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '318c395be673013c2478180f537d34bb73202dc5' }}
          persist-credentials: false
      - name: Verify exact source
        env:
          SOURCE_REF: ${{ inputs.ref || '318c395be673013c2478180f537d34bb73202dc5' }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$SOURCE_REF"
          mkdir -p artifacts/test-results
          printf "%s\n" "$SOURCE_REF" > artifacts/test-results/source-commit.txt
      - name: Arch dependencies and unprivileged builder
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja qt6-base qt6-tools qt6-webengine qt6-multimedia qt6-svg kstatusnotifieritem kwindowsystem kidletime tmux openssh python ccache dbus
          useradd -m user
          chown -R user:user "$GITHUB_WORKSPACE"
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/user/.cache/ccache
          key: arch-ccache-v1-${{ github.run_id }}
          restore-keys: arch-ccache-v1-
      - name: Desktop build
        run: |
          chown -R user:user /home/user
          runuser -u user -- bash scripts/ci/gui.sh build
      - name: Offscreen Qt suites
        run: runuser -u user -- env QTWEBENGINE_DISABLE_SANDBOX=1 bash scripts/ci/gui.sh test
      - name: Retain desktop test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-desktop-results
          path: artifacts/test-results
          retention-days: 7
  mac-desktop:
    if: ${{ (inputs.platform || 'macos') == 'all' || (inputs.platform || 'macos') == 'macos' }}
    name: macOS desktop, CLI and native compatibility
    runs-on: ${{ inputs.macos_runner == 'macos-15' && 'macos-15' || 'macos-26' }}
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      CARGO_TERM_COLOR: always
      ZERUS_PYTHON_JOBS: 6
      SOURCE_COMMIT: ${{ inputs.ref || '318c395be673013c2478180f537d34bb73202dc5' }}
      CCACHE_MAXSIZE: 100M
      CMAKE_GENERATOR: Ninja
      ZERUS_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '318c395be673013c2478180f537d34bb73202dc5' }}
          persist-credentials: false
      - name: Verify exact source
        id: verify
        env:
          SOURCE_REF: ${{ inputs.ref || '318c395be673013c2478180f537d34bb73202dc5' }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$SOURCE_REF"
          mkdir -p artifacts/test-results
          printf "%s\n" "$SOURCE_REF" > artifacts/test-results/source-commit.txt
          { sw_vers; printf 'Architecture: '; uname -m; } > artifacts/test-results/runner-platform.txt
      - name: macOS GUI and CLI dependencies
        run: brew install cmake ninja qt qtmultimedia ccache tmux python
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          node-version: '24'
      - name: Select stable Rust
        id: rust-toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Rust cache identity
        id: rust
        run: |
          echo "rustc=$(rustc -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('Cargo.lock') }}complete
          restore-keys: |
            cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('Cargo.lock') }}debug
            cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('Cargo.lock') }}
            cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ccache
          key: mac-desktop-ccache-v1-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: mac-desktop-ccache-v1-${{ runner.arch }}-
      - name: Desktop build
        run: bash scripts/ci/gui.sh build
      - name: Offscreen Qt suites
        run: bash scripts/ci/gui.sh test
      - name: CLI unit, integration and release build
        id: cli
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.node.outcome == 'success' && steps.rust-toolchain.outcome == 'success' }}
        run: |
          bash scripts/ci/cli.sh all
          shasum -a 256 target/debug/hgs > artifacts/test-results/native-hgs.sha256
      - name: Keyless latest Codex, Claude Code and OpenCode compatibility
        if: ${{ !cancelled() && steps.cli.outcome == 'success' }}
        run: |
          shasum -a 256 -c artifacts/test-results/native-hgs.sha256
          python3 scripts/ci/agent-compatibility.py --hgs "$GITHUB_WORKSPACE/target/debug/hgs"
      - name: Retain macOS test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-combined-results
          path: artifacts/test-results
          retention-days: 7
  windows-desktop:
    if: ${{ (inputs.platform || 'macos') == 'all' || (inputs.platform || 'macos') == 'windows' }}
    name: Windows desktop GUI and portable package
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      ZERUS_BUILD_JOBS: 4
      CCACHE_DEPEND: 1
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Check out text files unchanged
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '318c395be673013c2478180f537d34bb73202dc5' }}
          persist-credentials: false
      - name: Verify exact source
        env:
          SOURCE_REF: ${{ inputs.ref || '318c395be673013c2478180f537d34bb73202dc5' }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$SOURCE_REF"
          mkdir -p artifacts/test-results
          printf "%s\n" "$SOURCE_REF" > artifacts/test-results/source-commit.txt
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - name: Restore Qt 6.10.3 for MSVC
        id: qt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/Qt
          key: windows-qt-6.10.3-win64_msvc2022_64-${{ hashFiles('packaging/windows/qt.json', 'scripts/install-qt-windows.py', 'scripts/qt_archives.py') }}
      - name: Install the pinned Qt 6.10.3 for MSVC
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python scripts/install-qt-windows.py --output "$RUNNER_TEMP/Qt" </dev/null
      - name: Use Qt 6.10.3
        run: |
          python scripts/install-qt-windows.py --check "$RUNNER_TEMP/Qt" </dev/null
          qt=$(cygpath -w "$RUNNER_TEMP/Qt/6.10.3/msvc2022_64")
          test -f "$(cygpath -u "$qt")/bin/windeployqt.exe"
          echo "QT_ROOT_DIR=$qt" >> "$GITHUB_ENV"
      - name: Pinned ccache 4.14.1
        run: |
          cd "$(cygpath -u "$RUNNER_TEMP")"
          curl -fsSLO https://github.com/ccache/ccache/releases/download/v4.14.1/ccache-4.14.1-windows-x86_64.zip
          echo '6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4  ccache-4.14.1-windows-x86_64.zip' | sha256sum --check --strict
          python -m zipfile -e ccache-4.14.1-windows-x86_64.zip .
          cygpath -w "$PWD/ccache-4.14.1-windows-x86_64" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$(cygpath -w "$RUNNER_TEMP/ccache")" >> "$GITHUB_ENV"
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: windows-ccache-v1-${{ runner.arch }}-qt6.10.3-${{ github.run_id }}
          restore-keys: windows-ccache-v1-${{ runner.arch }}-qt6.10.3-
      - name: Desktop build
        run: bash scripts/ci/gui.sh build </dev/null
      - name: Offscreen Qt suites
        run: bash scripts/ci/gui.sh test </dev/null
      - name: Select Rust toolchains
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup toolchain install 1.99.1 --profile minimal
      - name: Rust cache identity
        id: rust
        run: |
          echo "rustc=$(rustc -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cli-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cli-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-
      - name: Build portable CLI and connector from this source
        run: |
          cargo fetch --locked
          cargo +1.99.1 fetch --locked --manifest-path services/mobile/connector/Cargo.toml
          cargo build --release --locked </dev/null 2>&1 | tee artifacts/test-results/portable-cli-build.log
          cargo +1.99.1 build --locked --release --manifest-path services/mobile/connector/Cargo.toml --target-dir target </dev/null 2>&1 | tee artifacts/test-results/portable-connector-build.log
      - name: Pinned ConPTY pair
        run: python scripts/fetch-conpty.py --output "$RUNNER_TEMP/conpty" </dev/null
      - name: Portable zip from this source
        run: |
          python scripts/package-windows.py --cli target/release/hgs.exe --gui .ci-build/gui/hgs-tray.exe \
            --connector target/release/zerus-mobile-connector.exe --conpty "$RUNNER_TEMP/conpty" --output artifacts/zerus-windows-x86_64.zip </dev/null 2>&1 | tee artifacts/test-results/package.log
          python scripts/check-windows-portable.py artifacts/zerus-windows-x86_64.zip --run --selftest \
            </dev/null 2>&1 | tee artifacts/test-results/portable.log
          sha256sum target/release/hgs.exe target/release/zerus-mobile-connector.exe .ci-build/gui/hgs-tray.exe artifacts/zerus-windows-x86_64.zip > artifacts/test-results/portable-sha256.txt
      - name: Retain portable package and desktop logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-portable-qualification
          path: artifacts
          retention-days: 7
          compression-level: 0